name: Build and publish Native Chat Tabs
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: native-chat-tabs-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Download Global Dalamud libraries
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'dalamud'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $dll = Get-ChildItem -LiteralPath $directory -Filter Dalamud.dll -Recurse -File | Select-Object -First 1
          if (-not $dll) { throw 'Dalamud.dll is missing.' }
          $api = [Reflection.AssemblyName]::GetAssemblyName($dll.FullName).Version.Major
          if ($api -ne 15) { throw 'This prototype requires Global Dalamud API 15.' }
          "DALAMUD_LIB_PATH=$($dll.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test recovery and profile models
        shell: pwsh
        run: |
          dotnet run --project NativeChatTabs/tests/NativeChatTabs.Core.Tests.csproj -c Release -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
      - name: Build plugin
        shell: pwsh
        run: |
          dotnet build NativeChatTabs/NativeChatTabs.csproj -c Release "-p:DalamudLibPath=$env:DALAMUD_LIB_PATH/" -p:NuGetAudit=false
          if ($LASTEXITCODE -ne 0) { throw 'Plugin build failed.' }
      - name: Package testing plugin
        shell: pwsh
        run: |
          & ./.github/scripts/Package.ps1 -SourceCheckout $env:GITHUB_WORKSPACE -OutputDirectory "$env:RUNNER_TEMP/native-feed" -DalamudDirectory $env:DALAMUD_LIB_PATH
      - uses: actions/upload-artifact@v4
        with:
          name: NativeChatTabsRepository
          path: ${{ runner.temp }}/native-feed/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: NativeChatTabsRepository
          path: ${{ runner.temp }}/native-feed/
      - name: Publish download files
        shell: pwsh
        run: |
          $publisher = Join-Path $env:RUNNER_TEMP 'Publish-NativeChatTabs.ps1'
          Copy-Item -LiteralPath .github/scripts/Publish.ps1 -Destination $publisher
          & $publisher -SourceCheckout $env:GITHUB_WORKSPACE -FeedDirectory "$env:RUNNER_TEMP/native-feed"
